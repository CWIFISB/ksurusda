name: CI-Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official frida gadget + apply rusda patch
        run: |
          set -euo pipefail
          FRIDA_VERSION=$(grep 'fridaVersion =' module.gradle | awk -F'"' '{print $2}')
          mkdir -p gadget
          for arch in arm arm64 x86 x86_64; do
            echo "=== frida $FRIDA_VERSION / $arch ==="
            curl -fsSL -o "g.so.xz" "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gadget-${FRIDA_VERSION}-android-${arch}.so.xz"
            xz -d -f g.so.xz
            python3 tools/rusda_patch.py g.so "gadget/libgadget-${arch}.so"
            rm -f g.so
            xz -e -f "gadget/libgadget-${arch}.so"
          done
          ls -la gadget/

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease

      - name: Get Module Info
        id: module-version
        run: |
          MODULE_VERSION=$(grep 'moduleVersion =' module.gradle | awk -F'"' '{print $2}')
          MODULE_VERSION_CODE=$(grep 'moduleVersionCode =' module.gradle | awk -F'= ' '{print $2}')
          echo "version=$MODULE_VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$MODULE_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: KsuRusda-${{ steps.module-version.outputs.version }}-release
          path: out/magisk_module_zygisk_release

      - name: Create Release ZIP
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd out/magisk_module_zygisk_release
          zip -r ../KsuRusda-${{ steps.module-version.outputs.version }}.zip .

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: KsuRusda ${{ steps.module-version.outputs.version }}
          generate_release_notes: true
          files: out/KsuRusda-${{ steps.module-version.outputs.version }}.zip

      - name: Update update.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail

          VERSION=${{ steps.module-version.outputs.version }}
          VERSION_CODE=${{ steps.module-version.outputs.versionCode }}

          printf '{\n    "version": "%s",\n    "versionCode": %s,\n    "zipUrl": "https://github.com/%s/releases/download/%s/KsuRusda-%s.zip",\n    "changelog": "https://raw.githubusercontent.com/%s/main/changelog.md"\n}\n' "$VERSION" "$VERSION_CODE" "${{ github.repository }}" "$VERSION" "$VERSION" "${{ github.repository }}" > update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout main
          git add update.json
          git commit -m "update update.json for ${VERSION}" || exit 0

          git remote set-url origin "https://x-access-token:${{ secrets.PAT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main || true
